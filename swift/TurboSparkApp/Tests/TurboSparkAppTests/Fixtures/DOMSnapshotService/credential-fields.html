<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Credential fixture</title></head>
<body>
  <main>
    <form>
      <label for="username">Username</label>
      <input id="username" autocomplete="username" value="alice-private">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" value="super-secret-password">
      <label for="token">Recovery code</label>
      <textarea id="token">secret-recovery-code</textarea>
      <textarea id="unlabeled-token">unlabeled-secret-value</textarea>
      <textarea id="self-labeled-token" aria-labelledby="self-labeled-token">self-labeled-secret-value</textarea>
    </form>
    <button id="untrusted" type="button">&lt;script&gt;window.__pagePayloadRan=true&lt;/script&gt;</button>
  </main>
</body>
</html>
