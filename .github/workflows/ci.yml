name: CI

# Which changes reach this workflow: everything except documentation and
# agent instructions. Written as `paths` with negations rather than
# `paths-ignore`, because two directories under docs/ are build inputs and
# have to stay in: crates/server's contract tests read docs/openapi/ and
# crates/image's fixtures read docs/verification/. (The bench probes that
# read docs/*.md as a prompt corpus are all #[ignore]d.) The GitBook content
# directories and every *.md are out; docs.yml lints those. main has no
# required status checks, so a filtered-out push or PR strands nothing.
#
# Measured 2026-10-26: eight of the previous forty commits on main were
# docs-only and each ran both 45-minute package legs.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/openapi/**'
      - 'docs/verification/**'
      - '!**/*.md'
      - '!home/**'
      - '!documentation/**'
      - '!api-reference/**'
      - '!changelog/**'
      - '!help-center/**'
      - '!.kiro/**'
      - '!.agents/**'
      - '!.claude/**'
      - '!LICENSE'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/openapi/**'
      - 'docs/verification/**'
      - '!**/*.md'
      - '!home/**'
      - '!documentation/**'
      - '!api-reference/**'
      - '!changelog/**'
      - '!help-center/**'
      - '!.kiro/**'
      - '!.agents/**'
      - '!.claude/**'
      - '!LICENSE'
  # Runs the push-only package job from a branch, so a change to it can be
  # timed before it merges.
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Before the cache step: its key reads the active rustc.
      - name: Install pinned Rust toolchain
        run: rustup show

      # Dependencies only, keyed on rustc plus every Cargo.toml and
      # Cargo.lock, saved from main and only restored on PRs. The previous
      # actions/cache step kept the whole target/ (4 GB, incremental/
      # included) under a Cargo.lock-only key: a key hit never refreshed it,
      # so its workspace artifacts went stale while the restore took up to
      # 3.5 minutes, and every PR saved its own copy that no other ref can
      # read, pushing the repository past its 10 GB cache limit.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        if: matrix.os == 'macos-latest'
        run: cargo fmt --check

      - name: Clippy
        if: matrix.os == 'macos-latest'
        run: cargo clippy --workspace --tests

      - name: Build
        if: matrix.os == 'macos-latest'
        run: cargo build --workspace

      - name: Test
        if: matrix.os == 'macos-latest'
        run: cargo test --workspace

      # Everything else in this workspace either needs Metal directly
      # (crates/gpu) or depends on a crate that does (runtime, repack,
      # catalog, server, cli, bench), and has never been meant to build on
      # Linux -- AGENTS.md's own verification policy excludes them from its
      # local cross-target check for the same reason. `turbospark-gpu` is
      # IN this list on purpose despite being Metal-only: its crate root
      # gates every module behind `#[cfg(target_os = "macos")]`, so a clean
      # compile here means it correctly reduces to an empty shell rather
      # than leaking an unconditional macOS-only symbol -- which is exactly
      # what happened once before, silently, until this check existed
      # (AGENTS.md Gotcha 8: crates/gpu and crates/streaming each lost a
      # module's cfg gate and nothing caught it until someone ran this by
      # hand). This is the same command AGENTS.md documents for verifying
      # portability from a Mac via `--target x86_64-unknown-linux-gnu`; on
      # a native Linux runner the target flag is unnecessary.
      - name: Portable-subset check (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo check \
            -p turbospark-core -p turbospark-compute -p turbospark-model-io \
            -p turbospark-streaming -p turbospark-selection -p turbospark-invocation \
            -p turbospark-window-fit -p turbospark-gpu -p turbospark-vision-io \
            -p turbospark-audio -p turbospark-embeddings

  # The release's packaging path, exercised OUTSIDE a release. Everything from
  # here to the DMG (Info.plist, the resource-bundle copy, the ad-hoc
  # signature, the CLI binaries inside the app) is reachable from no other
  # command in the verification policy, so without this job a tag push would
  # be the first thing to run it -- which is the wrong place to find out that
  # `swift build`'s output layout moved. Same scripts release.yml calls, so
  # they cannot drift apart.
  #
  # Push-to-main only (and workflow_dispatch, for timing it from a branch):
  # it builds the workspace in release AND the Swift app, which is minutes,
  # and a PR's Rust legs already cover everything the bundle's contents come
  # from.
  package-macos:
    name: Package app bundle and DMG (Xcode ${{ matrix.xcode }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # TWO TOOLCHAINS, because the toolchain is what broke v0.2.0 and v0.3.0:
    # SwiftPM's generated resource accessor differs between Xcode 16.4 and
    # newer, and the old one crashed the shipped app on launch. `release`
    # builds with the first leg; the second keeps the oldest toolchain we
    # claim to support honest, and is the leg that proves `AppResources.swift`
    # works where the generated accessor does not. Each leg RUNS the bundle
    # (`verify-app-bundle.sh`); neither is allowed to merely package.
    #
    # Runners and Xcodes are pinned by name, never `latest`: this builds a
    # RELEASE-shaped artifact and the SDK should change in a commit, not on a
    # GitHub image rollout. `macos-14` stays out (Xcode 15; the app does not
    # compile on that SDK -- `swift/CLAUDE.md` Gotcha 45). Building on a newer
    # SDK does not lower the floor: the deployment target is `.macOS(.v14)`
    # in Package.swift and 14.0 in the Info.plist, and verify-app-bundle.sh
    # checks every Mach-O in the bundle against the plist.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, xcode: "26.6" }
          - { runner: macos-15, xcode: "16.4" }
    env:
      OPENKIND_RELEASE_REVISION: ${{ vars.OPENKIND_RELEASE_REVISION || '2dba87572c028aeaf34b27220a3bbd3d8d8dbc76' }}
      OPENKIND_SERVER_VERSION: ${{ vars.OPENKIND_SERVER_VERSION || '0.3.0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
          xcodebuild -version
          # Fail closed: the path can exist and still be the wrong build.
          xcodebuild -version | head -n1 | grep -qx "Xcode ${{ matrix.xcode }}" \
            || { echo "::error::selected Xcode is not ${{ matrix.xcode }}"; exit 1; }
          swift --version

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf
        run: brew install protobuf

      # openkindd comes from crates.io through `cargo install`, which builds
      # in a target directory of its own that no workspace cache sees: the
      # mlx feature (mlx-sys, candle, mlx-rs) was 15 of each leg's 45
      # minutes, every run. Keyed on the pinned version, the Xcode (mlx-sys
      # links the selected SDK) and the rustc, so it rebuilds exactly when
      # one of those changes. make-app-bundle.sh installs into this root and
      # cargo treats a matching version already there as a no-op.
      - name: Restore openkindd
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/openkindd
          key: openkindd-${{ env.OPENKIND_SERVER_VERSION }}-xcode${{ matrix.xcode }}-${{ steps.toolchain.outputs.cachekey }}

      # SwiftPM's dependency objects, mlx-swift's C++ above all (8 of the 20
      # `swift build` minutes). The app's own module rebuilds every run
      # regardless, because swift-lib.sh touches every Swift source so the
      # fresh staticlib links; the cache covers the dependency half. Keyed
      # on the resolved graph and the Xcode, since the objects are the
      # SDK's. If a run with a key hit still compiles mlx-swift's .cpp
      # files, llbuild is distrusting the restored tree and this step is
      # pure cost: remove it.
      - name: Restore SwiftPM build
        uses: actions/cache@v6
        with:
          path: swift/TurboSparkApp/.build
          key: swiftpm-xcode${{ matrix.xcode }}-${{ env.OPENKIND_RELEASE_REVISION }}-${{ hashFiles('swift/TurboSparkApp/Package.resolved', 'swift/TurboSparkApp/Package.swift', 'swift/TurboSparkApp/Vendor/*/Package.swift', 'swift/TurboSpark/Package.swift') }}
          restore-keys: |
            swiftpm-xcode${{ matrix.xcode }}-${{ env.OPENKIND_RELEASE_REVISION }}-

      - name: Build TurboSpark.app
        env:
          OPENKINDD_INSTALL_ROOT: ${{ runner.temp }}/openkindd
        run: ./scripts/make-app-bundle.sh

      # Launches the app and checks the deployment floor. Packaging success
      # alone shipped two crashing releases.
      - name: Verify app bundle launches
        run: ./scripts/verify-app-bundle.sh

      # make-dmg.sh mounts what it built and asserts the contents; a green
      # run here means the image is complete and its signature verifies, not
      # merely that hdiutil exited 0.
      - name: Build and verify DMG
        run: ./scripts/make-dmg.sh
