name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (verify packaging without uploading to crates.io)'
        type: boolean
        required: true
        default: false
      crate:
        description: 'Crate to publish (choose "all" or specific crate name)'
        type: choice
        required: true
        default: 'all'
        options:
          - all
          - turbospark-core
          - turbospark-window-fit
          - turbospark-vision-io
          - turbospark-compute
          - turbospark-invocation
          - turbospark-model-io
          - turbospark-selection
          - turbospark-tokenizer
          - turbospark-repack
          - turbospark-catalog
          - turbospark-streaming
          - turbospark-gpu
          - turbospark-image
          - turbospark-runtime
          - turbospark-cli
          - turbospark-server

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Publish crate(s) to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_CRATE: ${{ inputs.crate }}
        run: |
          if [ "${DRY_RUN}" != "true" ] && [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required for live publish"
            exit 1
          fi

          ALL_CRATES=(
            turbospark-core
            turbospark-window-fit
            turbospark-vision-io
            turbospark-compute
            turbospark-invocation
            turbospark-model-io
            turbospark-selection
            turbospark-tokenizer
            turbospark-repack
            turbospark-catalog
            turbospark-streaming
            turbospark-gpu
            turbospark-image
            turbospark-runtime
            turbospark-cli
            turbospark-server
          )

          if [ "${TARGET_CRATE}" = "all" ]; then
            ORDER=("${ALL_CRATES[@]}")
          else
            ORDER=("${TARGET_CRATE}")
          fi

          EXTRA_ARGS=()
          if [ "${DRY_RUN}" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
            echo "::notice::Running publish in dry-run mode (no crates will be uploaded)"
          fi

          for crate in "${ORDER[@]}"; do
            echo "::group::cargo publish -p ${crate}"
            published=0
            attempt=0
            max_attempts=6
            while [ "${published}" -eq 0 ] && [ "${attempt}" -lt "${max_attempts}" ]; do
              attempt=$((attempt + 1))
              set +e
              out=$(cargo publish -p "${crate}" "${EXTRA_ARGS[@]}" 2>&1)
              status=$?
              set -e
              echo "${out}"
              if [ "${status}" -eq 0 ]; then
                published=1
              elif echo "${out}" | grep -qiE "already (uploaded|exists)"; then
                echo "::notice::${crate} already published at this version, continuing"
                published=1
              elif echo "${out}" | grep -qiE "(429 Too Many Requests|rate-limits|rate limit)"; then
                wait_sec=619
                target_date=$(echo "${out}" | sed -nE 's/.*try again after ([^.]+ GMT).*/\1/p' | head -1)
                if [ -n "${target_date}" ]; then
                  target_epoch=$(date -d "${target_date}" +%s 2>/dev/null || true)
                  now_epoch=$(date +%s)
                  if [ -n "${target_epoch}" ] && [ "${target_epoch}" -gt "${now_epoch}" ]; then
                    diff=$((target_epoch - now_epoch + 19))
                    if [ "${diff}" -gt 0 ]; then
                      wait_sec="${diff}"
                    fi
                  fi
                fi
                echo "::warning::Rate limit hit publishing ${crate} (attempt ${attempt}/${max_attempts}). Waiting ${wait_sec}s (10m 19s) before retrying..."
                sleep "${wait_sec}"
              elif echo "${out}" | grep -qiE "(failed to select a version|no matching package named|failed to download)"; then
                echo "::warning::Dependency index propagation delay for ${crate} (attempt ${attempt}/${max_attempts}). Waiting 20s before retrying..."
                sleep 20
              else
                echo "::error::cargo publish failed for ${crate}"
                echo "::endgroup::"
                exit "${status}"
              fi
            done

            if [ "${published}" -ne 1 ]; then
              echo "::error::Failed to publish ${crate} after ${max_attempts} attempts"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"

            # Give the registry index time to settle and pace new crate creation
            if [ "${DRY_RUN}" != "true" ]; then
              sleep 10
            fi
          done
