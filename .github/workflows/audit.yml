name: Audit

# RustSec advisory scan of Cargo.lock.
# Runs when the dependency graph can change, and weekly, because a new
# advisory can land against an unchanged lock. Reads only the lockfile, so
# it needs no build and no macOS runner. Ignored advisories, each with its
# reason, live in .cargo/audit.toml.
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Pinned so a cargo-audit release cannot change the verdict on its own.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Scan Cargo.lock
        run: cargo audit
