name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  check-version:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VER }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag == workspace version, changelog has an entry, and every path dep pinned to it
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)
          if [ "v${VER}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match [workspace.package] version v${VER}"
            exit 1
          fi
          # Intra-workspace deps carry a literal version for crates.io; a stale one
          # publishes a crate that cannot resolve its own siblings.
          BAD=$(grep -n 'path = "\.\./' crates/*/Cargo.toml | grep -v "version = \"${VER}\"" || true)
          if [ -n "${BAD}" ]; then
            echo "::error::path deps not pinned to ${VER}:"
            echo "${BAD}"
            exit 1
          fi
          # CHANGELOG.md must be updated as part of the version bump, not
          # after -- see docs/RELEASE.md. Matches "## [X.Y.Z]" with or
          # without a trailing " - YYYY-MM-DD" date.
          if ! grep -qE "^## \[${VER}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VER}]' entry -- move the Unreleased section there before tagging"
            exit 1
          fi
          echo "VER=${VER}" >> "$GITHUB_OUTPUT"
          echo "OK: ${TAG} matches v${VER}, CHANGELOG.md has an entry for it"

  build-macos:
    name: macOS arm64
    needs: [check-version]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release --target aarch64-apple-darwin \
            -p turbospark-cli -p turbospark-server

      - name: Stage zip
        env:
          VER: ${{ needs.check-version.outputs.version }}
        run: |
          mkdir -p dist/stage
          # The archive must contain files named exactly as the cask's binary
          # stanzas, or brew links the wrong names.
          # turbospark-check and turbospark-model are both [[bin]] targets of
          # the one turbospark-cli package, so `-p turbospark-cli` above
          # already built both.
          cp target/aarch64-apple-darwin/release/turbospark-check dist/stage/
          cp target/aarch64-apple-darwin/release/turbospark-model dist/stage/
          cp target/aarch64-apple-darwin/release/turbospark-server dist/stage/
          cd dist/stage && zip "../turbospark-${VER}-macos-arm64.zip" \
            turbospark-check turbospark-model turbospark-server
          cd .. && rm -rf stage && ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [check-version, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract this version's CHANGELOG.md section
        id: notes
        env:
          VER: ${{ needs.check-version.outputs.version }}
        run: |
          # Body of the "## [VER] ..." section, up to (not including) the
          # next "## [" heading or EOF. check-version already asserted this
          # heading exists, so a miss here would mean the two diverged.
          awk -v ver="$VER" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > /tmp/changelog-section.md
          echo "--- release body from CHANGELOG.md ---"
          cat /tmp/changelog-section.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: /tmp/changelog-section.md
          # Appended below body_path's content: a categorized PR/commit
          # list GitHub generates from the diff since the previous tag.
          generate_release_notes: true

  publish-crates:
    name: Publish to crates.io
    needs: [check-version, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo publish, one crate at a time in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set; skipping crates.io publish"
            exit 0
          fi
          # Topological order -- keep in sync with docs/RELEASE.md and with
          # crates/*/Cargo.toml's internal `path = "../x", version = "..."`
          # deps. One `cargo publish -p` call per crate rather than a single
          # `cargo publish --workspace`: cargo's workspace-publish behavior
          # on a partial re-run (some crates already published from a prior
          # failed attempt) is undocumented, and its own changelog warns
          # publish is "non-atomic ... left in partially published state"
          # on a server error. A per-crate loop that treats "already
          # published" as success for THAT crate and continues gives a
          # re-run of the same tag correct resume behavior regardless.
          ORDER=(
            turbospark-core
            turbospark-window-fit
            turbospark-compute
            turbospark-invocation
            turbospark-model-io
            turbospark-selection
            turbospark-tokenizer
            turbospark-repack
            turbospark-catalog
            turbospark-streaming
            turbospark-gpu
            turbospark-runtime
            turbospark-cli
            turbospark-server
          )
          for crate in "${ORDER[@]}"; do
            echo "::group::cargo publish -p ${crate}"
            set +e
            out=$(cargo publish -p "${crate}" 2>&1)
            status=$?
            set -e
            echo "${out}"
            echo "::endgroup::"
            if [ "${status}" -ne 0 ]; then
              if echo "${out}" | grep -qiE "already (uploaded|exists)"; then
                echo "::notice::${crate} already published at this version, continuing"
              else
                echo "::error::cargo publish failed for ${crate}"
                exit "${status}"
              fi
            fi
          done

  update-homebrew-cask:
    name: Update Homebrew Cask
    needs: [check-version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Detect tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HOMEBREW_TAP_TOKEN not set; skipping tap update"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute SHA256 from the published release asset
        if: steps.tap.outputs.available == 'true'
        id: sha
        env:
          VER: ${{ needs.check-version.outputs.version }}
        run: |
          URL="https://github.com/whit3rabbit/turbospark/releases/download/v${VER}/turbospark-${VER}-macos-arm64.zip"
          curl -fsSL --retry 5 --retry-delay 5 "${URL}" -o arm64.zip
          echo "arm=$(sha256sum arm64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.tap.outputs.available == 'true'
        with:
          repository: whit3rabbit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render cask
        if: steps.tap.outputs.available == 'true'
        env:
          VER: ${{ needs.check-version.outputs.version }}
          ARM: ${{ steps.sha.outputs.arm }}
        run: |
          cat > homebrew-tap/Casks/turbospark.rb <<EOF
          cask "turbospark" do
            version "${VER}"
            sha256 "${ARM}"

            url "https://github.com/whit3rabbit/turbospark/releases/download/v#{version}/turbospark-#{version}-macos-arm64.zip"
            name "turbospark"
            desc "Apple Silicon MoE inference engine streaming expert weights from SSD"
            homepage "https://github.com/whit3rabbit/turbospark"

            depends_on arch: :arm64
            depends_on macos: ">= :sonoma"

            binary "turbospark-check"
            binary "turbospark-model"
            binary "turbospark-server"
          end
          EOF
          ruby -c homebrew-tap/Casks/turbospark.rb

      - name: Commit and push cask
        if: steps.tap.outputs.available == 'true'
        working-directory: homebrew-tap
        env:
          VER: ${{ needs.check-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/turbospark.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update turbospark cask to ${VER}"
          git push origin main
