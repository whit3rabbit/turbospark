name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  check-version:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag == workspace version, changelog has an entry, and every path dep pinned to it
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)
          if [ "v${VER}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match [workspace.package] version v${VER}"
            exit 1
          fi
          # Intra-workspace deps carry a literal version for crates.io; a stale one
          # publishes a crate that cannot resolve its own siblings.
          BAD=$(grep -n 'path = "\.\./' crates/*/Cargo.toml | grep -v "version = \"${VER}\"" || true)
          if [ -n "${BAD}" ]; then
            echo "::error::path deps not pinned to ${VER}:"
            echo "${BAD}"
            exit 1
          fi
          # CHANGELOG.md must be updated as part of the version bump, not
          # after -- see docs/RELEASE.md. Matches "## [X.Y.Z]" with or
          # without a trailing " - YYYY-MM-DD" date.
          if ! grep -qE "^## \[${VER}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VER}]' entry -- move the Unreleased section there before tagging"
            exit 1
          fi
          echo "VER=${VER}" >> "$GITHUB_OUTPUT"
          echo "OK: ${TAG} matches v${VER}, CHANGELOG.md has an entry for it"

      - name: Check the app's minimum macOS agrees across the three places it is written
        run: |
          # LSMinimumSystemVersion (make-app-bundle.sh), the SwiftPM platform
          # (Package.swift) and `depends_on macos:` (the casks rendered below)
          # are three copies of one number. Two are greppable and are checked
          # here; the third is a literal in this file, so keep the mapping in
          # mind -- Homebrew's :sonoma IS 14. A mismatch ships an app that
          # brew installs onto a system it cannot launch on.
          PLIST_MIN=$(sed -nE 's/^min_macos="([0-9]+)\.[0-9]+".*/\1/p' scripts/make-app-bundle.sh)
          PKG_MIN=$(sed -nE 's/.*platforms: \[\.macOS\(\.v([0-9]+)\)\].*/\1/p' \
            swift/TurboSparkApp/Package.swift)
          if [ -z "${PLIST_MIN}" ] || [ -z "${PKG_MIN}" ]; then
            echo "::error::could not read the minimum macOS from one of the two files (a pattern rotted)"
            exit 1
          fi
          if [ "${PLIST_MIN}" != "${PKG_MIN}" ]; then
            echo "::error::minimum macOS disagrees: Info.plist says ${PLIST_MIN}, Package.swift says ${PKG_MIN}"
            exit 1
          fi
          echo "OK: app minimum macOS is ${PKG_MIN} in both places; casks must say the matching brew symbol"

  build-macos:
    name: macOS arm64 (CLI zip + app DMG)
    needs: [check-version]
    # **`macos-15`, NOT `macos-14`, AND NOT `macos-latest`.** The `-14` image
    # is Xcode 15 / the macOS 14 SDK, and this is the only job in the
    # repository that compiles Swift at all -- so the app half sat broken on
    # main while every local build was green (`swift/CLAUDE.md` Gotcha 45:
    # a `#available`-guarded macOS 15 symbol still has to RESOLVE, only
    # `body` is main-actor-isolated there, and the type checker's budget is
    # smaller). Building on a newer SDK does not lower the app's floor: the
    # DEPLOYMENT target is `.macOS(.v14)` in Package.swift and 14.0 in the
    # Info.plist, which release.yml's own `check-version` job asserts agree.
    # Pinned rather than `latest` because this builds a RELEASE artifact and
    # the SDK it was built against should change in a commit, not on a
    # GitHub image rollout.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # ONE job builds both artifacts, deliberately. The CLI binaries ship
      # twice -- loose in the zip, and inside TurboSpark.app for the cask to
      # link onto PATH -- and building them in two jobs would let the two
      # copies drift (different cache state, different toolchain patch). Here
      # they are literally the same files, copied twice.
      #
      # make-app-bundle.sh does all three builds: the FFI staticlib
      # (scripts/swift-lib.sh), the CLI + server, and the Swift app.
      - name: Build app bundle (also builds the CLI and the server)
        env:
          VER: ${{ needs.check-version.outputs.version }}
        run: ./scripts/make-app-bundle.sh --version "${VER}"

      - name: Stage CLI zip
        env:
          VER: ${{ needs.check-version.outputs.version }}
        run: |
          mkdir -p dist/stage
          # The archive must contain files named exactly as the cask's binary
          # stanzas, or brew links the wrong names.
          # turbospark-check and turbospark-model are both [[bin]] targets of
          # the one turbospark-cli package, so one `-p turbospark-cli` build
          # produces both.
          cp target/aarch64-apple-darwin/release/turbospark-check dist/stage/
          cp target/aarch64-apple-darwin/release/turbospark-model dist/stage/
          cp target/aarch64-apple-darwin/release/turbospark-server dist/stage/
          cd dist/stage && zip "../turbospark-${VER}-macos-arm64.zip" \
            turbospark-check turbospark-model turbospark-server
          cd .. && rm -rf stage

      - name: Build DMG
        env:
          VER: ${{ needs.check-version.outputs.version }}
        run: ./scripts/make-dmg.sh --version "${VER}"

      # The Sparkle feed that lets installed apps update in place. Signed with
      # the repo's EdDSA key; the DMG above is the update archive it points
      # at, so there is no new artifact to build -- only this XML. The secret
      # is release-critical: publishing a new latest release without the
      # appcast would turn the evergreen feed URL into a 404 for every app.
      - name: Build Sparkle appcast
        env:
          VER: ${{ needs.check-version.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_ED_PRIVATE_KEY}" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is required; refusing to publish a release without appcast.xml"
            exit 1
          fi
          ./scripts/make-sparkle-appcast.sh --version "${VER}"

      - name: List artifacts
        run: ls -l dist/

      # dist/ also holds the unzipped TurboSpark.app that the DMG was built
      # from. Only the shippable files are uploaded; the loose bundle would be
      # a third, redundant, several-hundred-megabyte upload. appcast.xml
      # rides along and becomes the feed the bundle's SUFeedURL resolves
      # through releases/latest/download/.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.xml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [check-version, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract this version's CHANGELOG.md section
        id: notes
        env:
          VER: ${{ needs.check-version.outputs.version }}
        run: |
          # Body of the "## [VER] ..." section, up to (not including) the
          # next "## [" heading or EOF. check-version already asserted this
          # heading exists, so a miss here would mean the two diverged.
          awk -v ver="$VER" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > /tmp/changelog-section.md
          echo "--- release body from CHANGELOG.md ---"
          cat /tmp/changelog-section.md

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          body_path: /tmp/changelog-section.md
          # Appended below body_path's content: a categorized PR/commit
          # list GitHub generates from the diff since the previous tag.
          generate_release_notes: true

  publish-crates:
    name: Publish to crates.io
    needs: [check-version, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: cargo publish, one crate at a time in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set; skipping crates.io publish"
            exit 0
          fi
          # Topological order -- keep in sync with docs/RELEASE.md and with
          # crates/*/Cargo.toml's internal `path = "../x", version = "..."`
          # deps. One `cargo publish -p` call per crate rather than a single
          # `cargo publish --workspace`: cargo's workspace-publish behavior
          # on a partial re-run (some crates already published from a prior
          # failed attempt) is undocumented, and its own changelog warns
          # publish is "non-atomic ... left in partially published state"
          # on a server error. A per-crate loop that treats "already
          # published" as success for THAT crate and continues gives a
          # re-run of the same tag correct resume behavior regardless.
          ORDER=(
            turbospark-core
            turbospark-window-fit
            turbospark-compute
            turbospark-invocation
            turbospark-model-io
            turbospark-selection
            turbospark-tokenizer
            turbospark-repack
            turbospark-catalog
            turbospark-streaming
            turbospark-gpu
            turbospark-runtime
            turbospark-cli
            turbospark-server
          )
          for crate in "${ORDER[@]}"; do
            echo "::group::cargo publish -p ${crate}"
            set +e
            out=$(cargo publish -p "${crate}" 2>&1)
            status=$?
            set -e
            echo "${out}"
            echo "::endgroup::"
            if [ "${status}" -ne 0 ]; then
              if echo "${out}" | grep -qiE "already (uploaded|exists)"; then
                echo "::notice::${crate} already published at this version, continuing"
              else
                echo "::error::cargo publish failed for ${crate}"
                exit "${status}"
              fi
            fi
          done

  update-homebrew-cask:
    name: Update Homebrew Cask
    needs: [check-version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Detect tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HOMEBREW_TAP_TOKEN not set; skipping tap update"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute SHA256 from the published release assets
        if: steps.tap.outputs.available == 'true'
        id: sha
        env:
          VER: ${{ needs.check-version.outputs.version }}
        run: |
          BASE="https://github.com/whit3rabbit/turbospark/releases/download/v${VER}"
          # Hashed from what a user will actually download, not from the
          # build job's local copy: a cask whose sha256 came from anywhere
          # other than the published asset can be correct and still wrong
          # about the file brew fetches.
          curl -fsSL --retry 5 --retry-delay 5 "${BASE}/turbospark-${VER}-macos-arm64.zip" -o cli.zip
          curl -fsSL --retry 5 --retry-delay 5 "${BASE}/TurboSpark-${VER}-arm64.dmg" -o app.dmg
          echo "zip=$(sha256sum cli.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "dmg=$(sha256sum app.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tap.outputs.available == 'true'
        with:
          repository: whit3rabbit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # TWO CASKS, ONE TAP. A cask has exactly one `url`, so "app and CLI" and
      # "CLI only" cannot be one cask with a flag -- Homebrew has no such
      # flag. `turbospark` installs the DMG (app in /Applications, plus the
      # CLI binaries that ship INSIDE the bundle, linked onto PATH from
      # there); `turbospark-cli` installs the zip and nothing else.
      # `conflicts_with` is declared on BOTH, because Homebrew does not
      # infer the reverse edge, and without it the second install would try
      # to link three binary names the first already owns.
      - name: Render casks
        if: steps.tap.outputs.available == 'true'
        env:
          VER: ${{ needs.check-version.outputs.version }}
          DMG: ${{ steps.sha.outputs.dmg }}
          ZIP: ${{ steps.sha.outputs.zip }}
        run: |
          mkdir -p homebrew-tap/Casks

          cat > homebrew-tap/Casks/turbospark.rb <<EOF
          cask "turbospark" do
            version "${VER}"
            sha256 "${DMG}"

            url "https://github.com/whit3rabbit/turbospark/releases/download/v#{version}/TurboSpark-#{version}-arm64.dmg"
            name "TurboSpark"
            desc "Apple Silicon MoE inference engine streaming expert weights from SSD"
            homepage "https://github.com/whit3rabbit/turbospark"

            # The app updates itself through Sparkle (the release's signed
            # appcast), replacing the bundle in place. Without this stanza
            # brew would keep offering `brew upgrade` for versions the app
            # already installed, and an upgrade would fight the updater over
            # the same /Applications path.
            auto_updates true

            depends_on arch: :arm64
            depends_on macos: ">= :sonoma"

            conflicts_with cask: "whit3rabbit/tap/turbospark-cli"

            app "TurboSpark.app"

            # The three CLI binaries ship inside the bundle. Linking them from
            # there rather than shipping a second copy is what lets one cask
            # cover both, and it means \`brew uninstall\` removes the app and
            # unlinks the commands in one step.
            binary "#{appdir}/TurboSpark.app/Contents/MacOS/turbospark-check"
            binary "#{appdir}/TurboSpark.app/Contents/MacOS/turbospark-model"
            binary "#{appdir}/TurboSpark.app/Contents/MacOS/turbospark-server"

            # Only runs under \`brew uninstall --zap\`. Deliberately does NOT
            # list ~/.turbospark: that is where multi-gigabyte model installs
            # live, and a zap is not the place to silently delete them.
            zap trash: [
              "~/Library/Application Support/TurboSpark",
              "~/Library/Preferences/com.whit3rabbit.turbospark.plist",
              "~/Library/Saved Application State/com.whit3rabbit.turbospark.savedState",
            ]
          end
          EOF

          cat > homebrew-tap/Casks/turbospark-cli.rb <<EOF
          cask "turbospark-cli" do
            version "${VER}"
            sha256 "${ZIP}"

            url "https://github.com/whit3rabbit/turbospark/releases/download/v#{version}/turbospark-#{version}-macos-arm64.zip"
            name "turbospark command-line tools"
            desc "Apple Silicon MoE inference engine (command-line tools only, no desktop app)"
            homepage "https://github.com/whit3rabbit/turbospark"

            depends_on arch: :arm64
            depends_on macos: ">= :sonoma"

            conflicts_with cask: "whit3rabbit/tap/turbospark"

            binary "turbospark-check"
            binary "turbospark-model"
            binary "turbospark-server"
          end
          EOF

          ruby -c homebrew-tap/Casks/turbospark.rb
          ruby -c homebrew-tap/Casks/turbospark-cli.rb

      - name: Commit and push casks
        if: steps.tap.outputs.available == 'true'
        working-directory: homebrew-tap
        env:
          VER: ${{ needs.check-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/turbospark.rb Casks/turbospark-cli.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update turbospark casks to ${VER}"
          git push origin main
