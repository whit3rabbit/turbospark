<!-- @dsCard group="Inputs" height=150 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Composer</title></head>
<body>
<div class="ts-stage">
  <div class="ts-composer">
    <textarea placeholder="Ask anything" aria-label="Ask anything"></textarea>
    <div class="ts-spread">
      <button class="ts-icon-btn" aria-label="Add Files or Photos..." title="Add Files or Photos..."><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ts-chip" aria-pressed="true"><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/></svg> Approve for me</button>
      <button class="ts-chip" aria-pressed="false"><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg> Search Web</button>
      <span class="ts-grow"></span>
      <button class="ts-chip" aria-pressed="false"><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v7M3.5 15l6.8-2M20.5 15l-6.8-2"/></svg> Steering</button>
      <button class="ts-icon-btn" aria-label="Dictate (insert text)" title="Dictate (insert text)"><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="ts-send" aria-label="Send" title="Send"><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
