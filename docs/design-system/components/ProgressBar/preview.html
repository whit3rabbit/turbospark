<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProgressBar</title></head>
<body>
<div class="ts-stage">
  <div>
    <div class="ts-spread"><span class="ts-grow" id="p1" style="font-size:14px;font-weight:500">Downloading model files</span><span class="ts-mono ts-label" style="font-size:12px">12.4 / 20.4 GB</span></div>
    <div class="ts-progress" role="progressbar" aria-labelledby="p1" aria-valuenow="61" aria-valuemin="0" aria-valuemax="100" style="margin-top:var(--space-6)"><div class="ts-progress-fill" style="width:61%"></div></div>
  </div>
  <div>
    <span class="ts-label" id="p2">Opening the model: reading weights and allocating the KV cache</span>
    <div class="ts-progress is-indeterminate" role="progressbar" aria-labelledby="p2" style="margin-top:var(--space-6)"><div class="ts-progress-fill"></div></div>
  </div>
  <div class="ts-spread">
    <span class="ts-label" id="p3">Paused</span>
    <div class="ts-progress is-compact is-paused ts-grow" role="progressbar" aria-labelledby="p3" aria-valuenow="34" aria-valuemin="0" aria-valuemax="100"><div class="ts-progress-fill" style="width:34%"></div></div>
  </div>
</div>
</body>
</html>
