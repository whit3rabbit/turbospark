<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Chip</title></head>
<body>
<div class="ts-stage">
  <div class="ts-row">
    <button class="ts-chip" aria-pressed="true" title="Approve for me: run tools, ask before high-risk actions"><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/></svg> Approve for me</button>
    <button class="ts-chip" aria-pressed="false"><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg> Search Web</button>
    <button class="ts-chip" aria-pressed="false"><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v7M3.5 15l6.8-2M20.5 15l-6.8-2"/></svg> Steering</button>
    <button class="ts-chip" aria-pressed="false" aria-label="Dictate (insert text)" title="Dictate (insert text)"><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="ts-chip" disabled title="Load a model to change steering"><svg class="ts-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v7M3.5 15l6.8-2M20.5 15l-6.8-2"/></svg> Steering</button>
  </div>
</div>
</body>
</html>
