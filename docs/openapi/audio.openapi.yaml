openapi: 3.1.0
info:
  title: TurboSpark audio API
  version: 0.1.0
  description: |
    Speech-to-text, text-to-speech and music generation served by
    `turbospark-server` (`turbospark serve`). The routes exist only when the
    server was started with `--stt-model`, `--tts-model` or `--music-model`.

    What this server does not do, so clients can plan around it:

    - Input audio is WAV only (PCM 8/16/24/32-bit or float32). There is no
      mp3, flac, ogg or opus decoder; other uploads get 415.
    - Output audio is WAV or raw PCM only.
    - Streaming is segment-granular. The runners decode a whole clip at a
      time, so there is no live partial text.
    - Word timestamps, confidences, diarization and translation are not
      available.
    - There is no TLS. Use `--api-key`, and a tunnel if the network is not
      trusted.

    This file is contract-tested against the router's route list
    (`turbospark_server::audio::AUDIO_ROUTE_PATHS`).
servers:
  - url: http://127.0.0.1:8080
security:
  - bearer: []
  - apiKey: []
paths:
  /v1/audio/transcriptions:
    post:
      summary: Transcribe a WAV file
      description: |
        Send `multipart/form-data`, or a raw `audio/wav` (or
        `application/octet-stream`) body with the options in the query string.
        Unsupported options are refused with 400 rather than ignored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TranscriptionForm'
          audio/wav:
            schema:
              type: string
              format: binary
      parameters:
        - { name: model, in: query, schema: { type: string }, description: Required for raw bodies. }
        - { name: language, in: query, schema: { type: string } }
        - { name: response_format, in: query, schema: { $ref: '#/components/schemas/TranscriptionFormat' } }
        - { name: stream, in: query, schema: { type: boolean } }
        - { name: async, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: |
            The transcript. With `stream=true` the body is NDJSON: a `start`
            line, one `segment` line per segment, then `complete` (or a single
            `error` line). Segment lines arrive together once the runner
            finishes.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Transcription'
                  - $ref: '#/components/schemas/VerboseTranscription'
            text/plain: { schema: { type: string } }
            text/vtt: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        '202':
          description: Accepted as an async job (`async=true`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Busy' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/audio/translations:
    post:
      summary: Not implemented
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/audio/transcriptions/realtime:
    get:
      summary: Utterance-level realtime transcription (WebSocket)
      description: |
        Upgrade to a WebSocket. Send binary frames of 16 kHz mono PCM
        (`s16le`, or `f32le` with `encoding=f32le`), then the text frame
        `{"type":"commit"}`. The server transcribes everything buffered since
        the last commit and replies
        `{"type":"complete","segment_id":N,"text":"...","language":"en","segments":[...]}`.
        Errors arrive as `{"type":"error","message":"..."}`. `{"type":"reset"}`
        discards buffered audio. Limits: 300 s buffered per socket, 1 MiB per
        frame, 60 s idle timeout, 8 concurrent sockets. Authentication is the
        usual header on the upgrade request, so browsers cannot use this route.
      parameters:
        - { name: model, in: query, required: true, schema: { type: string } }
        - { name: encoding, in: query, schema: { type: string, enum: [s16le, f32le], default: s16le } }
        - { name: language, in: query, schema: { type: string } }
      responses:
        '101': { description: Switching protocols }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Busy' }
  /v1/audio/speech:
    post:
      summary: Synthesize speech (Kokoro, English, voice af_heart)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpeechRequest' }
      responses:
        '200':
          description: |
            24 kHz mono audio. The rate is also in `x-audio-sample-rate`.
            With `stream=true` (pcm only) the body is chunked, one chunk per
            synthesized segment; a mid-stream failure ends the body early.
          headers:
            x-audio-sample-rate: { schema: { type: integer } }
          content:
            audio/wav: { schema: { type: string, format: binary } }
            audio/pcm: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Busy' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/audio/generate:
    post:
      summary: Generate music (MiniMax Music 3, macOS and Metal)
      description: |
        Runs for minutes or longer at full size; prefer `async=true`. Output
        quality is unqualified: only short smoke runs are recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '200':
          description: 44.1 kHz stereo 16-bit WAV.
          content:
            audio/wav: { schema: { type: string, format: binary } }
        '202':
          description: Accepted as an async job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Busy' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/audio/jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Job status
      responses:
        '200':
          description: Job status. `running` covers both queued and executing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Cancel a running job, or delete a finished one
      description: |
        Cancelling stops waiting and drops queued work. A job a model worker
        already started runs to completion and its result is discarded.
      responses:
        '200':
          description: Cancelled or deleted.
          content:
            application/json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/Error' }
  /v1/audio/jobs/{id}/result:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Job result
      description: |
        The body the synchronous route would have returned, in the format
        requested at submission. A failed job returns its own error status.
        409 while running, 410 if cancelled.
      responses:
        '200':
          description: The result.
          content:
            application/json: { schema: { type: object } }
            text/plain: { schema: { type: string } }
            text/vtt: { schema: { type: string } }
            audio/wav: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /v1/audio/models:
    get:
      summary: List attached audio models
      responses:
        '200':
          description: Attached models.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Model' }
    post:
      summary: Attach an installed model by catalog alias
      description: |
        Aliases only. A filesystem path is refused, since this route is
        reachable over HTTP. Opening reads the whole model, so the call can
        take seconds to minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id]
              additionalProperties: false
              properties:
                model_id: { type: string }
      responses:
        '201':
          description: Attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/audio/models/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Unload a model
      responses:
        '200':
          description: Unloaded.
          content:
            application/json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The model has running jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/metrics:
    get:
      summary: Prometheus metrics (audio series only)
      responses:
        '200':
          description: Text exposition format.
          content:
            text/plain: { schema: { type: string } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    apiKey: { type: apiKey, in: header, name: x-api-key }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Busy:
      description: Queue full. Retry after the `retry-after` seconds.
      headers:
        retry-after: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            param: { type: [string, 'null'] }
    TranscriptionFormat:
      type: string
      enum: [json, verbose_json, text, srt, vtt]
      default: json
    TranscriptionForm:
      type: object
      required: [file, model]
      properties:
        file: { type: string, format: binary, description: WAV only; up to 128 MiB and 30 minutes. }
        model: { type: string }
        language: { type: string, description: A language tag, or auto. }
        response_format: { $ref: '#/components/schemas/TranscriptionFormat' }
        stream: { type: boolean, default: false }
        async: { type: boolean, default: false }
        prompt: { type: string, description: Accepted only when empty. }
        temperature: { type: number, description: Accepted only as 0. }
        timestamp_granularities[]: { type: string, enum: [segment], description: '"word" is refused.' }
    Transcription:
      type: object
      properties:
        text: { type: string }
    VerboseTranscription:
      type: object
      properties:
        task: { type: string, const: transcribe }
        language: { type: [string, 'null'] }
        duration: { type: number }
        text: { type: string }
        segments:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              start: { type: number }
              end: { type: number }
              text: { type: string }
    SpeechRequest:
      type: object
      required: [model, input]
      additionalProperties: false
      properties:
        model: { type: string }
        input: { type: string, maxLength: 4096, description: '`text` is accepted as an alias.' }
        voice: { type: string, default: af_heart }
        speed: { type: number, minimum: 0.5, maximum: 2.0, default: 1.0 }
        response_format: { type: string, enum: [wav, pcm], default: wav, description: pcm is 16-bit little-endian mono. }
        stream: { type: boolean, default: false, description: Requires pcm. }
    GenerateRequest:
      type: object
      required: [model, prompt]
      additionalProperties: false
      properties:
        model: { type: string }
        prompt: { type: string, description: The caption. }
        lyrics: { type: string, default: '[instrumental]' }
        audio_length: { type: number, exclusiveMinimum: 0, maximum: 360, description: Seconds. }
        num_inference_steps: { type: integer, minimum: 1, maximum: 30 }
        seed: { type: integer, minimum: 0 }
        response_format: { type: string, const: wav }
        async: { type: boolean, default: false }
    JobAccepted:
      type: object
      properties:
        job_id: { type: string }
        id: { type: string }
        object: { type: string, const: audio.job }
        status: { type: string, const: running }
        poll_url: { type: string }
    Job:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: audio.job }
        kind: { type: string, enum: [transcription, generation] }
        model: { type: string }
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        created: { type: integer }
        result_url: { type: string }
        error:
          type: object
          properties:
            status: { type: integer }
            message: { type: string }
    Model:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: model }
        owned_by: { type: string }
        task: { type: string, enum: [speech_to_text, text_to_speech, music_generation] }
        capabilities:
          type: array
          items: { type: string }
