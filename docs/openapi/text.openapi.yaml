openapi: 3.1.0
info:
  title: TurboSpark Text and Chat API
  version: 0.4.0
  description: |
    Text generation, OpenAI-compatible chat completions, Anthropic-compatible
    messages, and Ollama-compatible endpoints served by `turbospark-server`
    (`turbospark serve`).
servers:
  - url: http://127.0.0.1:8080
    description: Default local server
security:
  - bearer: []
  - apiKey: []
paths:
  /health:
    get:
      summary: Server liveness and readiness probe
      description: |
        Lock-free health check. Never requires authentication. Returns 200 with
        status ok and state ready (when at least one model is loaded) or empty.
      security: []
      responses:
        '200':
          description: Health check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/chat/completions:
    post:
      summary: Create chat completion
      description: |
        OpenAI-compatible chat completion endpoint. Supports text generation,
        reasoning channels, structured tool calling, and multimodal image input.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            Successful completion. Returns JSON when stream=false, or an SSE stream
            of ChatCompletionChunk objects when stream=true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Busy' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/completions:
    post:
      summary: Raw prompt completion
      description: |
        OpenAI legacy raw-prompt completion. Encodes the prompt directly without
        applying a chat template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
      responses:
        '200':
          description: Completion response or SSE stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResponse'
            text/event-stream:
              schema:
                type: string
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Busy' }
        '500': { $ref: '#/components/responses/Error' }

  /v1/responses:
    post:
      summary: OpenAI Responses API
      description: Item-shaped request and response endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: Response or SSE stream of ResponsesStreamEvent
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Busy' }
        '500': { $ref: '#/components/responses/Error' }

  /v1/messages:
    post:
      summary: Anthropic messages completion
      description: |
        Anthropic-compatible messages endpoint. Automatically translated to/from
        the core generation engine.
      parameters:
        - name: anthropic-version
          in: header
          schema:
            type: string
          description: Anthropic API version tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessageRequest'
      responses:
        '200':
          description: Message response or SSE stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessageResponse'
            text/event-stream:
              schema:
                type: string
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Busy' }
        '500': { $ref: '#/components/responses/Error' }

  /v1/messages/count_tokens:
    post:
      summary: Anthropic token count probe
      description: Counts prompt tokens without running generation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessageRequest'
      responses:
        '200':
          description: Input token count
          content:
            application/json:
              schema:
                type: object
                properties:
                  input_tokens:
                    type: integer
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/models:
    get:
      summary: List available models
      description: Lists loaded and available models.
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'

  /v1/models/{model}:
    get:
      summary: Retrieve model details
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '404': { $ref: '#/components/responses/Error' }

  /api/tags:
    get:
      summary: Ollama tags listing
      responses:
        '200':
          description: List of models in Ollama format
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items: { type: object }

  /api/version:
    get:
      summary: Ollama version probe
      responses:
        '200':
          description: Server version string
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }

  /api/show:
    post:
      summary: Ollama model metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Model details
          content:
            application/json:
              schema:
                type: object
        '404': { $ref: '#/components/responses/Error' }

  /api/chat:
    post:
      summary: Ollama chat completion
      description: Returns NDJSON streaming chunks or a single JSON payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OllamaChatRequest'
      responses:
        '200':
          description: Chat reply or NDJSON stream
          content:
            application/json: { schema: { type: object } }
            application/x-ndjson: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/generate:
    post:
      summary: Ollama prompt completion
      description: Returns NDJSON streaming chunks or a single JSON payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OllamaGenerateRequest'
      responses:
        '200':
          description: Generation response or NDJSON stream
          content:
            application/json: { schema: { type: object } }
            application/x-ndjson: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/metrics:
    get:
      summary: Prometheus metrics exposition
      responses:
        '200':
          description: Text-format metrics
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    apiKey:
      type: apiKey
      in: header
      name: x-api-key

  responses:
    Error:
      description: Request error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Busy:
      description: Concurrency limit reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        state: { type: string, enum: [ready, empty], example: ready }

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            param: { type: [string, 'null'] }
            code: { type: [string, 'null'] }

    Model:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: model }
        created: { type: integer }
        owned_by: { type: string, example: turbospark }

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant, tool]
              content:
                oneOf:
                  - type: string
                  - type: array
                    items: { type: object }
        max_tokens: { type: [integer, 'null'] }
        temperature: { type: number, default: 0.7 }
        top_p: { type: number, default: 0.95 }
        stream: { type: boolean, default: false }
        stop:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        tools:
          type: array
          items: { type: object }
        tool_choice:
          oneOf:
            - type: string
            - type: object

    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: chat.completion }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message:
                type: object
                properties:
                  role: { type: string }
                  content: { type: [string, 'null'] }
                  tool_calls: { type: array, items: { type: object } }
              finish_reason: { type: string }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }

    CompletionRequest:
      type: object
      required: [model, prompt]
      properties:
        model: { type: string }
        prompt:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        max_tokens: { type: integer, default: 16 }
        temperature: { type: number, default: 1.0 }
        stream: { type: boolean, default: false }

    CompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: text_completion }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              index: { type: integer }
              finish_reason: { type: string }

    ResponsesRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: object }
        stream: { type: boolean, default: false }

    AnthropicMessageRequest:
      type: object
      required: [model, messages, max_tokens]
      properties:
        model: { type: string }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content:
                oneOf:
                  - type: string
                  - type: array
                    items: { type: object }
        max_tokens: { type: integer }
        system: { type: string }
        stream: { type: boolean, default: false }

    AnthropicMessageResponse:
      type: object
      properties:
        id: { type: string }
        type: { type: string, example: message }
        role: { type: string, example: assistant }
        content:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: text }
              text: { type: string }
        model: { type: string }
        stop_reason: { type: string }
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }

    OllamaChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string }
              content: { type: string }
        stream: { type: boolean, default: true }

    OllamaGenerateRequest:
      type: object
      required: [model, prompt]
      properties:
        model: { type: string }
        prompt: { type: string }
        stream: { type: boolean, default: true }
