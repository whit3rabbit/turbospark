[workspace]
resolver = "2"
members = ["crates/core", "crates/compute", "crates/invocation", "crates/selection", "crates/window-fit", "crates/tokenizer", "crates/model-io", "crates/streaming", "crates/gpu", "crates/runtime", "crates/cli", "crates/repack", "crates/server", "crates/bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Clean-room implementation"]
description = "Behavior-compatible Rust implementation of an approved local inference engine and its command-line surface."
publish = false
