[package]
name = "turbospark-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # dev harness: reads local model installs, not useful on crates.io
description = "Throughput benchmark harness: three fixed prompts, fixed seeds, a discarded warmup run per prompt, driven through the raw-completion loop."

[[bin]]
name = "turbospark-bench"
path = "src/main.rs"

[dependencies]
foundation = { package = "turbospark-core", path = "../core", version = "0.1.0" }
runtime = { package = "turbospark-runtime", path = "../runtime", version = "0.1.0" }
selection = { package = "turbospark-selection", path = "../selection", version = "0.1.0" }
tokenizer = { package = "turbospark-tokenizer", path = "../tokenizer", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
repack = { package = "turbospark-repack", path = "../repack", version = "0.1.0" }
# `ModelFamily`, for `real_model::protocol_parameters`'s exhaustive match
# (the protocol's context window and generation budget are per-family), and
# `hash_data` for tests/quality_common's golden output digests. Was a
# dev-dependency until the resolver needed it in `src/`; a regular
# dependency is visible to the tests too, so nothing moved out of reach.
model_io = { package = "turbospark-model-io", path = "../model-io", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# phys_footprint sampling for tests/memory_oracle.rs (proc_pid_rusage).
libc = "0.2"
# `oracle_common::assert_agrees_with_catalog`: every self-measured
# `ChipBaseline` row is checked against the `measured` block in
# `models.json` that it was calibrated from. Offline, no install, and NOT
# `#[ignore]`d -- the whole point is that it reddens on the edit rather than
# the next time somebody has a 13 GB install on disk.
turbospark-catalog = { path = "../catalog", version = "0.1.0" }
