[package]
name = "mrefrust-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Throughput benchmark harness: three fixed prompts, fixed seeds, a discarded warmup run per prompt, driven through the raw-completion loop."

[[bin]]
name = "mference-bench"
path = "src/main.rs"

[dependencies]
foundation = { package = "mrefrust-core", path = "../core" }
runtime = { package = "mrefrust-runtime", path = "../runtime" }
selection = { package = "mrefrust-selection", path = "../selection" }
tokenizer = { package = "mrefrust-tokenizer", path = "../tokenizer" }

[target.'cfg(target_os = "macos")'.dependencies]
repack = { package = "mrefrust-repack", path = "../repack" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# phys_footprint sampling for tests/memory_oracle.rs (proc_pid_rusage).
libc = "0.2"
# hash_data, for tests/quality_common's golden output digests. The
# workspace's one hex-SHA-256 helper; adds no external crate (`sha2`
# already ships inside model-io).
model_io = { package = "mrefrust-model-io", path = "../model-io" }
