[package]
name = "turbospark-streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Routed-expert streaming: pread-based cache streamer, LFU/LRU eviction policy, and readahead advice."

[lib]
name = "turbospark_streaming"
path = "src/lib.rs"

[dependencies]
foundation = { package = "turbospark-core", path = "../core" }
model_io = { package = "turbospark-model-io", path = "../model-io" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
