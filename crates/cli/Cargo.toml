[package]
name = "turbospark-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The turbospark-check process entry point: reads argv, calls the invocation crate, applies its exit-status/stream-routing decisions, and prints the resolved request."

[[bin]]
name = "turbospark-check"
path = "src/main.rs"

[dependencies]
invocation = { package = "turbospark-invocation", path = "../invocation" }
runtime = { package = "turbospark-runtime", path = "../runtime" }
selection = { package = "turbospark-selection", path = "../selection" }
tokenizer = { package = "turbospark-tokenizer", path = "../tokenizer" }
repack = { package = "turbospark-repack", path = "../repack" }
model_io = { package = "turbospark-model-io", path = "../model-io" }
window_fit = { package = "turbospark-window-fit", path = "../window-fit" }
serde_json = "1"
