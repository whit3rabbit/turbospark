[package]
name = "turbospark-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shared primitives and public runtime configuration."

[lib]
name = "turbospark_core"
path = "src/lib.rs"

[dependencies]
# Half-precision (IEEE-754 binary16) logits. MIT OR Apache-2.0.
half = "2"

[dev-dependencies]
# `humanizer.rs`'s fingerprint test: the vendored instruction must reproduce
# the publisher's SHA-256 prefix byte for byte.
sha2 = "0.10"
