# Dev-only reference environment for the Frozen E port (multitalker_asr and the
# Nemotron-3 diarizer coupling). Never shipped and never used by tests. It
# converts the NVIDIA .nemo checkpoints and writes golden tensors and traces.
# uv.lock beside this file pins every resolved version.
[project]
name = "turbospark-nemo-218d0b4-reference"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The normative reference for Frozen E. Keep this exact commit.
    "nemo-toolkit[asr] @ git+https://github.com/NVIDIA-NeMo/Speech@218d0b443441b7d8aa1c832f47df310f186cf0a4",
    # CPU wheel from PyPI on macOS arm64. NeMo needs >= 2.7.
    "torch>=2.7.0",
    "safetensors",
    "pyyaml",
    "numpy",
]

[tool.uv]
package = false
# Apple Silicon only. NeMo's own uv sources route torch to a different index per
# platform, which conflicts in a universal resolve. On darwin it uses PyPI.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
