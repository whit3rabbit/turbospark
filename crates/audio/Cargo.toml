[package]
name = "turbospark-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Only `turbospark-ffi` (itself `publish = false`) consumes this crate today,
# so it stays off crates.io until a published crate needs it. Flipping this
# means adding it to the publish order in docs/RELEASE.md and
# .github/workflows/publish-crates.yml.
publish = false
description = "Portable audio engine: decode, resample, analysis, WAV output, and the speech model session contract."

[lib]
name = "turbospark_audio"
path = "src/lib.rs"

[dependencies]
# Audio decode. MPL-2.0 (file-level copyleft; linking from MIT code is fine,
# modifications to symphonia's own files would have to stay MPL). Pure Rust,
# which is what keeps this crate checkable for a non-macOS target.
# 0.5.x, NOT 0.6: 0.6 raises its MSRV to 1.85 and the workspace pins 1.82.
# `default-features = false` plus an explicit list: no `opt-simd` (target
# specific), no metadata readers nothing here uses.
symphonia = { version = "0.5.5", default-features = false, features = [
    "wav", "aiff", "caf", "isomp4", "mkv", "ogg",
    "pcm", "adpcm", "flac", "mp3", "aac", "alac", "vorbis",
] }
# Option and report structs cross the C ABI as JSON. MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
