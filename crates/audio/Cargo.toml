[package]
name = "turbospark-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Unified portable audio crate: DSP primitives (waveform, WAV I/O, resampling, FFT, STFT, mel spectrograms), neural audio ops, and models organized by role (music, STT, TTS, VAD, STS, codec, LID)."
# testdata/ holds ~340 MB of parity fixtures read only by #[cfg(test)]
# code; shipping it would exceed the crates.io 10 MB .crate limit.
exclude = ["testdata/"]

[lib]
name = "turbospark_audio"
path = "src/lib.rs"

[dependencies]
turbospark-core = { path = "../core", version = "0.6.0" }
turbospark-model-io = { path = "../model-io", version = "0.6.0" }
turbospark-tokenizer = { path = "../tokenizer", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
# Persistent worker pool for the `ops` kernels. Already in this crate's
# tree through `tokenizers`, so it adds no new crates.
rayon = "1"

# tokenizers permits newer releases that exceed our Rust 1.82 MSRV.
unicode-segmentation = "=1.12.0"
