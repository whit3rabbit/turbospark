[package]
name = "mrefrust-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Metal GPU backend: pipeline cache and kernel dispatch, validated against the compute crate's CPU reference kernels."

[lib]
name = "mrefrust_gpu"
path = "src/lib.rs"

[dependencies]
foundation = { package = "mrefrust-core", path = "../core" }

[dev-dependencies]
mrefrust-compute = { path = "../compute" }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
half = "2"
model_io = { package = "mrefrust-model-io", path = "../model-io" }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
half = "2"
mrefrust-repack = { path = "../repack" }
