[package]
name = "turbospark-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Metal GPU backend: pipeline cache and kernel dispatch, validated against the compute crate's CPU reference kernels."

[lib]
name = "turbospark_gpu"
path = "src/lib.rs"

[dependencies]
foundation = { package = "turbospark-core", path = "../core", version = "0.1.0" }
# Real (non-dev) dependency since the TurboQuant KV-cache feature: the
# Lloyd-Max codebook, sign vectors and midpoints this crate's
# `kv_quant_tables.rs` builds at open are host-side computation with no
# GPU dependency of their own, and `turbospark-compute` already implements
# and tests them -- see that crate's `kv_quant` module. Every OTHER use of
# `turbospark-compute` in this crate remains test-only (CPU reference
# kernels validating a Metal dispatch); this one builds real runtime state.

turbospark-compute = { path = "../compute", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
half = "2"
model_io = { package = "turbospark-model-io", path = "../model-io", version = "0.1.0" }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
half = "2"
# Already a dependency above; repeated here so tests that build their own
# FunctionConstantValues (the split-KV chunk bench) can name the types.
metal = "0.33"
turbospark-repack = { path = "../repack", version = "0.1.0" }
