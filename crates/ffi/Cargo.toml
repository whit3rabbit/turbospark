[package]
name = "turbospark-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "C ABI over the inference engine, for native GUI hosts (Swift/SwiftUI). Opaque session handle, streaming event callback, cancel-from-any-thread."

[lib]
name = "turbospark_ffi"
# `staticlib` is what SwiftPM links. `rlib` is what this crate's own tests
# link, so every entry point below is exercised through the SAME function
# bodies the C header exposes rather than through a Rust-shaped wrapper
# around them.
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
foundation = { package = "turbospark-core", path = "../core", version = "0.1.0" }
runtime = { package = "turbospark-runtime", path = "../runtime", version = "0.1.0" }
selection = { package = "turbospark-selection", path = "../selection", version = "0.1.0" }
tokenizer = { package = "turbospark-tokenizer", path = "../tokenizer", version = "0.1.0" }
window_fit = { package = "turbospark-window-fit", path = "../window-fit", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Portable on purpose: nothing in the catalog decodes, so a GUI can browse
# the table, probe a repository and install a model on any platform even
# where it cannot then run one.
catalog = { package = "turbospark-catalog", path = "../catalog", version = "0.1.0" }
# For `LoadGuard` alone, and portable for the same reason the catalog is: the
# guard is read by `ts_recommend_json` as well as by `ts_session_open`, and
# recommending is one of the things a GUI does on a machine that cannot
# decode. `runtime` re-exports the type but is macOS-only, so naming it
# through that crate would make the portable half unbuildable.
model_io = { package = "turbospark-model-io", path = "../model-io", version = "0.1.0" }
# For `ts_server_start`'s in-process HTTP server: the same `ChatModel` trait,
# router and OpenAI/Anthropic envelopes `turbospark-server` serves standalone
# with, wrapped here around this crate's own already-open `SessionCore`
# rather than a second `RealForwardRunner` (`session.rs`'s module doc). This
# crate compiles `turbospark-server` itself, not its binary, and that crate
# is portable off macOS (its `RealChatModel` half is the only part gated),
# so this stays an unconditional dependency like `catalog` and `model_io`
# above.
turbospark-server = { path = "../server", version = "0.1.0" }
# Versions and features matched to `crates/server/Cargo.toml` on purpose: two
# copies of axum/tokio at different versions in one binary is silent bloat
# rather than a build error, and `ts_server_start` hands `turbospark-server`
# a `Router` built from ITS axum, so this crate's `axum::serve` call has to
# be literally the same crate version, not just API-compatible.
axum = { version = "0.7", features = ["json"] }
# Image decode, preprocessing and the mRoPE splice for `ts_generate`'s image
# content parts. Portable BY DESIGN rather than by luck (the whole point of
# splitting vision preprocessing out is that it lives somewhere a non-macOS
# build can reach), so it goes here beside `catalog` and `model_io` rather
# than in the macOS block, and the crate that consumes it is gated instead.
turbospark-vision-io = { path = "../vision-io", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }

# The session only exists where the engine does. Everything else in this
# crate -- the error slot, the string helpers, the catalog and probe surface
# -- is portable, so `ts_session_open` is REFUSED BY NAME off macOS rather
# than the crate failing to build.
[target.'cfg(target_os = "macos")'.dependencies]
repack = { package = "turbospark-repack", path = "../repack", version = "0.1.0" }
# For `memory::FootprintSampler`, the SAME mach counter every frozen row in
# `docs/BENCHMARKS.md` is measured with. A GUI status panel reporting a
# different number than the oracle asserts would be worse than reporting none.
bench = { package = "turbospark-bench", path = "../bench", version = "0.1.0" }

[dev-dependencies]
serde_json = "1"
# For `tests/c_surface.rs`'s in-process server tests: a real HTTP client is
# the only way to prove `ts_server_start` actually served a request, rather
# than merely constructing a `Router`. Same spec as `crates/server`'s own
# dev-dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
