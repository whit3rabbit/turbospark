[package]
name = "turbospark-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # dev harness: measures local installs on this machine
description = "Evaluator for kernel and method experiments: per-family phase profiles, gated interleaved A/B with a statistical verdict, shape-derived kernel benches, and an append-only ledger."

# The ANE+Steel prefill split as an A/B arm, and the ane_handoff kernel bench
# (which calls the gpu and coreml halves directly). Off by default, like the
# runtime.
[features]
ane-prefill = [
    "runtime/ane-prefill",
    "turbospark-bench/ane-prefill",
    "turbospark-coreml/ane-prefill",
    "gpu/ane-prefill",
]

[[bin]]
name = "tslab"
path = "src/bin/tslab.rs"

[[bin]]
name = "tslab-worker"
path = "src/bin/tslab_worker.rs"

# The portable half (stats, ledger, spec, knob table) builds everywhere so its
# tests run on any host; everything that opens a model or a Metal device is
# macOS-only, like crates/bench.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
foundation = { package = "turbospark-core", path = "../core", version = "0.6.5" }
# `tslab serve`, the read-only dashboard over the lab dir (src/dash). The same
# axum and tokio crates/server and crates/ffi pin, so no new package enters the
# lockfile; `json` is the only axum feature a GET-only dashboard needs.
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

[dev-dependencies]
# Router smoke tests drive the dashboard without a socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
runtime = { package = "turbospark-runtime", path = "../runtime", version = "0.6.5" }
model_io = { package = "turbospark-model-io", path = "../model-io", version = "0.6.5" }
repack = { package = "turbospark-repack", path = "../repack", version = "0.6.5" }
selection = { package = "turbospark-selection", path = "../selection", version = "0.6.5" }
tokenizer = { package = "turbospark-tokenizer", path = "../tokenizer", version = "0.6.5" }
catalog = { package = "turbospark-catalog", path = "../catalog", version = "0.6.5" }
gpu = { package = "turbospark-gpu", path = "../gpu", version = "0.6.5" }
turbospark-coreml = { path = "../coreml", version = "0.6.5" }
turbospark-bench = { path = "../bench", version = "0.6.5" }
# The audio arm names the runtime's audio request types (worker_audio.rs).
audio = { package = "turbospark-audio", path = "../audio", version = "0.6.5" }
# `vision_encode` preprocesses its synthetic pages (kernel/vision_encode.rs).
turbospark-vision-io = { path = "../vision-io", version = "0.6.5" }
half = "2"
