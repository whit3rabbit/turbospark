[package]
name = "turbospark-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The curated model catalog, the header-only Hugging Face probe, and the install driver that turns either into a .gturbo directory."

[dependencies]
foundation = { package = "turbospark-core", path = "../core", version = "0.1.0" }
model_io = { package = "turbospark-model-io", path = "../model-io", version = "0.1.0" }
repack = { package = "turbospark-repack", path = "../repack", version = "0.1.0" }
tokenizer = { package = "turbospark-tokenizer", path = "../tokenizer", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
