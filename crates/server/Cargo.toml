[package]
name = "turbospark-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenAI Chat Completions and Anthropic Messages server on loopback: request/response envelopes, SSE streaming framing, and the axum router, wired to the raw-completion loop."

[lib]
name = "turbospark_server"
path = "src/lib.rs"

[[bin]]
name = "turbospark-server"
path = "src/main.rs"

[dependencies]
foundation = { package = "turbospark-core", path = "../core" }
runtime = { package = "turbospark-runtime", path = "../runtime" }
selection = { package = "turbospark-selection", path = "../selection" }
tokenizer = { package = "turbospark-tokenizer", path = "../tokenizer" }
# Anthropic <-> OpenAI translation, and the OpenAI wire types this server's
# envelopes are built from. Default features only: that is the pure, IO-free
# core (serde/thiserror/tracing/uuid). The `middleware` feature is deliberately
# NOT enabled -- it forwards over reqwest to a `backend_url` (this server's
# backend is in-process) and pulls axum 0.8 against our 0.7.
anyllm_translate = "0.16"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

# Only the real (macOS/GPU) backend needs the manifest peeker; on other
# platforms `real_model.rs` does not compile at all.
[target.'cfg(target_os = "macos")'.dependencies]
repack = { package = "turbospark-repack", path = "../repack" }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
