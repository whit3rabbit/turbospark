[package]
name = "turbospark-server"
version.workspace = true
edition.workspace = true
# NOT `workspace = true`, and this is the ONE crate that overrides it. The
# workspace floor is 1.82 and `forge-guardrails` declares 1.87, so a workspace
# inheriting 1.82 here would be a claim this crate cannot honour. Overriding on
# THIS crate rather than raising the workspace is what keeps the other fifteen
# honest: none of them has the higher floor, and `rust-toolchain.toml` pins
# `stable` so no build in this repo was ever taking 1.82 literally anyway.
rust-version = "1.87"
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "OpenAI Chat Completions and Anthropic Messages server on loopback: request/response envelopes, SSE streaming framing, and the axum router, wired to the raw-completion loop."

[lib]
name = "turbospark_server"
path = "src/lib.rs"

[[bin]]
name = "turbospark-server"
path = "src/main.rs"

[dependencies]
foundation = { package = "turbospark-core", path = "../core", version = "0.1.0" }
runtime = { package = "turbospark-runtime", path = "../runtime", version = "0.1.0" }
selection = { package = "turbospark-selection", path = "../selection", version = "0.1.0" }
tokenizer = { package = "turbospark-tokenizer", path = "../tokenizer", version = "0.1.0" }
# Image content parts on both endpoints (ROADMAP M-V8): decode, preprocess,
# the placeholder splice and the mRoPE walk. PORTABLE -- this crate compiles
# off macOS and so does this dependency, which is why it sits here rather
# than in the `cfg(target_os = "macos")` block beside `repack`.
turbospark-vision-io = { path = "../vision-io", version = "0.1.0" }
# Anthropic <-> OpenAI translation, and the OpenAI wire types this server's
# envelopes are built from. Default features only: that is the pure, IO-free
# core (serde/thiserror/tracing/uuid). The `middleware` feature is deliberately
# NOT enabled -- it forwards over reqwest to a `backend_url` (this server's
# backend is in-process) and pulls axum 0.8 against our 0.7.
anyllm_translate = "0.16"
# Tool-call guardrails: rescue parsing, argument validation, retry nudges.
# `default-features = false` is LOAD BEARING and not tidiness. The default
# feature set is that crate's proxy: it pulls axum 0.7 (fine), reqwest, tokio,
# sentry, clap, nix and FOUR `anyllm_*` crates at 0.9.9 -- including
# `anyllm_translate`, which this crate is on 0.16 of, so a second copy would
# compile. Measured at the split: 383 packages against 29. The `guardrails`
# feature is the pure half (serde, serde_json, thiserror, indexmap,
# regex-lite, anyhow, log, tracing) and every one of the heavy crates is
# reachable from nothing this crate calls -- the backend here is a Metal model
# in-process, so a client, a proxy route and a managed-server process manager
# are all dead weight. Do not turn the defaults on to reach one function.
forge-guardrails = { version = "0.1.3", default-features = false, features = ["guardrails"] }
# The local rescue strategies (`guardrails/extra_formats.rs`) match dialect
# markup with regexes. `regex-lite` is ALREADY in this crate's dependency
# tree -- forge's own `guardrails` feature pulls it -- so this adds no new
# package, only a second direct edge to it.
regex-lite = "0.1"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

# Only the real (macOS/GPU) backend needs the manifest peeker or the catalog
# store; on other platforms `real_model.rs` does not compile at all and
# `--model` is refused before either could be reached. `catalog` adds no new
# external crate here: its dependency set is a subset of `repack`'s plus
# `tokenizer`, both of which this crate already links.
[target.'cfg(target_os = "macos")'.dependencies]
repack = { package = "turbospark-repack", path = "../repack", version = "0.1.0" }
catalog = { package = "turbospark-catalog", path = "../catalog", version = "0.1.0" }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
