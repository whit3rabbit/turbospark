[package]
name = "turbospark-tokenizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tokenizer wrapper, chat-template rendering, streaming detokenizer, and tool-call parsing for the supported model dialects."

[lib]
name = "turbospark_tokenizer"
path = "src/lib.rs"

[dependencies]
foundation = { package = "turbospark-core", path = "../core", version = "0.1.0" }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "2", features = ["fuel", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
